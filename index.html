<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .folder {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 18px;
      box-shadow: 0 2px 8px #ddd;
      cursor: pointer;
    }

    .folder:hover {
      background: #eef5ff;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📁 My Documents</h1>

    <div class="folder">🪪 Aadhaar</div>
    <div class="folder">💳 PAN Card</div>
    <div class="folder">🎓 Education</div>
    <div class="folder">🏦 Bank Documents</div>
    <div class="folder">📸 Photos</div>
    <div class="folder">📄 Other Documents</div>
  </div>

</body>
</html>
